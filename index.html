<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finances">
<meta name="theme-color" content="#EEF2F8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>Finances</title>
<script>
  // Apply the saved theme before first paint (no flash).
  try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* ---------- tokens ---------- */
:root {
  --paper: #EEF2F8; --surface: #FFFFFF; --raised: #F6F8FC; --ink: #121A2E; --muted: #5B6680; --line: #DDE3EE;
  --lagoon: #0E8C7F; --indigo: #3B5BDB; --sky: #6FA3F7; --rose: #E0577A; --saffron: #E89B2B; --coral: #D6453D; --slate: #9AA5BC;
  --lagoon-soft: #DDF3EF; --coral-soft: #FBE4E2;
  --num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --r-hero: 28px; --r-card: 18px; --r-ctl: 12px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #0B1222; --surface: #141D33; --raised: #1B2641; --ink: #EAF0FF; --muted: #93A0BD; --line: #26334F;
  --lagoon: #3DD6B5; --indigo: #7C93FF; --sky: #8EC1FF; --rose: #FF7FA0; --saffron: #FFC061; --coral: #FF7A70; --slate: #5E6B88;
  --lagoon-soft: #123A37; --coral-soft: #3A1E24;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0B1222; --surface: #141D33; --raised: #1B2641; --ink: #EAF0FF; --muted: #93A0BD; --line: #26334F;
    --lagoon: #3DD6B5; --indigo: #7C93FF; --sky: #8EC1FF; --rose: #FF7FA0; --saffron: #FFC061; --coral: #FF7A70; --slate: #5E6B88;
    --lagoon-soft: #123A37; --coral-soft: #3A1E24;
    color-scheme: dark;
  }
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--paper); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.45 var(--text); font-variant-numeric: tabular-nums;
  padding: env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom)); }
h1, h2, h3 { margin: 0; letter-spacing: -0.015em; }
h2 { font-size: 16px; font-weight: 650; margin-bottom: 12px; }
.h1 { font-size: 26px; font-weight: 750; font-family: var(--num); }
.fine { color: var(--muted); font-size: 13px; margin: 6px 0 12px; }
.pad { padding: 4px 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--num); }

.app { max-width: 680px; margin: 0 auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 4px; }
.topbar h1 { font-family: var(--num); font-size: 30px; font-weight: 800; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.banner { display: block; width: calc(100% - 24px); margin: 8px 12px 0; padding: 11px 14px; border: 1px solid color-mix(in srgb, var(--saffron) 55%, transparent); background: color-mix(in srgb, var(--saffron) 14%, var(--surface)); border-radius: var(--r-ctl); text-align: left; font-size: 14px; }

/* ---------- period picker ---------- */
.modes { display: flex; gap: 2px; margin: 12px 12px 0; padding: 3px; background: var(--raised); border: 1px solid var(--line); border-radius: 14px; }
.modes button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 11px; font-size: 14px; font-weight: 550; color: var(--muted); transition: background .2s, color .2s; }
.modes [aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px color-mix(in srgb, var(--ink) 18%, transparent); }
.periods { display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px 2px; scrollbar-width: none; }
.periods::-webkit-scrollbar { display: none; }
.periods button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-family: var(--num); font-weight: 600; }
.periods [aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

/* ---------- hero: the month as a flow of money ---------- */
.hero { margin: 12px 12px 14px; padding: 22px 20px 18px; background: var(--surface); border-radius: var(--r-hero); border: 1px solid var(--line); }
.hero-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.hero-head p { margin: 0; color: var(--muted); font-size: 14px; }
.badge { font-size: 12px; font-weight: 650; padding: 4px 10px; border-radius: 999px; background: var(--lagoon-soft); color: var(--lagoon); white-space: nowrap; }
.badge.neg { background: var(--coral-soft); color: var(--coral); }
.saved-fig { font-family: var(--num); font-weight: 800; font-size: clamp(44px, 12vw, 64px); letter-spacing: -0.035em; line-height: 1; margin: 10px 0 4px; }
.saved-fig.neg { color: var(--coral); }
.saved-cap { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.river { display: flex; height: 22px; border-radius: 11px; overflow: hidden; background: var(--raised); gap: 2px; }
.river i { display: block; height: 100%; transform-origin: left; animation: grow .7s cubic-bezier(.2,.8,.2,1) both; }
.river i:nth-child(2) { animation-delay: .06s; } .river i:nth-child(3) { animation-delay: .12s; } .river i:nth-child(4) { animation-delay: .18s; } .river i:nth-child(5) { animation-delay: .24s; }
.river .over { background: repeating-linear-gradient(135deg, var(--coral) 0 5px, transparent 5px 9px); }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.c-fixed { background: var(--indigo); } .c-variable { background: var(--sky); } .c-onetime { background: var(--rose); } .c-india { background: var(--saffron); } .c-saved { background: var(--lagoon); } .c-earned { background: var(--ink); }
.flow { list-style: none; margin: 16px 0 0; padding: 0; }
.flow li { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; font-size: 15px; }
.flow li .dot { width: 10px; height: 10px; border-radius: 3px; }
.flow li span { color: var(--muted); }
.flow li b { font-family: var(--num); font-weight: 650; }
.flow li.lead span, .flow li.total span { color: var(--ink); font-weight: 600; }
.flow li.total { border-top: 2px solid var(--ink); margin-top: 4px; padding-top: 10px; }
.flow li.total b { font-size: 18px; }
.flow li.sub span { font-size: 13px; }
.went { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--raised); }
.went h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.went div { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
.went b { font-family: var(--num); }
.seal { margin: 14px 0 0; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.seal::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--slate); flex: none; }
.seal.ok::before { background: var(--lagoon); }
.seal.bad { color: var(--coral); } .seal.bad::before { background: var(--coral); }
button.seal { border: 0; background: none; padding: 0; text-align: left; }

/* ---------- cards & charts ---------- */
.card { margin: 0 12px 12px; padding: 18px; background: var(--surface); border-radius: var(--r-card); border: 1px solid var(--line); }
.card.danger h2 { color: var(--coral); }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--slate); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 10px; font-family: var(--text); }
.chart .val { fill: var(--ink); font-size: 10px; font-weight: 700; font-family: var(--num); }
.b-in { fill: var(--lagoon); opacity: .45; } .b-out { fill: var(--indigo); opacity: .4; }
.b-in.sel, .b-out.sel { opacity: 1; }
.l-sav { fill: none; stroke: var(--ink); stroke-width: 1.8; } .d-sav { fill: var(--surface); stroke: var(--ink); stroke-width: 1.8; }
.a-rate { fill: color-mix(in srgb, var(--lagoon) 18%, transparent); } .l-rate { fill: none; stroke: var(--lagoon); stroke-width: 2.4; } .d-rate { fill: var(--lagoon); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 10px 0 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.k-in { background: var(--lagoon); } .k-out { background: var(--indigo); } .k-sav { background: var(--ink); height: 3px !important; vertical-align: 3px !important; }
.hbars { list-style: none; margin: 0; padding: 0; }
.hbars li { position: relative; display: flex; justify-content: space-between; padding: 9px 12px; margin-bottom: 5px; font-size: 14px; }
.hbars li i { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--sky) 22%, transparent); border-radius: 10px; z-index: 0; }
.hbars span, .hbars b { position: relative; z-index: 1; }
.hbars b { font-family: var(--num); }

/* ---------- tables ---------- */
.seg { display: flex; gap: 2px; margin: 12px 12px 10px; padding: 3px; background: var(--raised); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 11px; font-size: 13px; font-weight: 550; color: var(--muted); white-space: nowrap; }
.seg [aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px color-mix(in srgb, var(--ink) 18%, transparent); }
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 12px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); }
table.grid { border-collapse: collapse; font-size: 13px; min-width: 100%; }
.grid th, .grid td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.grid td, .grid tfoot th { font-family: var(--num); }
.grid thead th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--surface); }
.grid th:first-child { position: sticky; left: 0; background: var(--surface); text-align: left; white-space: normal; min-width: 140px; max-width: 170px; font-weight: 500; z-index: 1; box-shadow: 1px 0 0 var(--line); font-family: var(--text); }
.grid td button { border: 0; background: none; padding: 0; text-align: right; display: block; width: 100%; font-family: var(--num); }
.grid td small { display: block; color: var(--muted); font-size: 10px; white-space: nowrap; font-family: var(--text); }
.grid td.nil { color: var(--slate); }
.grid .tot { font-weight: 700; }
.grid tr.bar th span { position: sticky; left: 10px; display: inline-block; }
.grid tr.bar th { background: var(--raised); color: var(--indigo); font-size: 12px; font-weight: 650; text-align: left; position: static; box-shadow: none; }
.grid tfoot th, .grid tfoot td { font-weight: 700; border-bottom: 0; background: var(--raised); }
.grid tfoot tr:first-child th, .grid tfoot tr:first-child td { border-top: 2px solid var(--ink); }

/* ---------- controls ---------- */
.btn { display: inline-block; border: 1px solid var(--line); background: var(--surface); padding: 11px 16px; border-radius: var(--r-ctl); font-size: 15px; font-weight: 600; margin: 4px 6px 4px 0; text-align: center; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.warn { color: var(--coral); border-color: var(--coral); background: transparent; }
.link { border: 0; background: none; color: var(--indigo); padding: 0; font-weight: 550; }
.link.danger { color: var(--coral); }
.link.small { font-size: 13px; grid-column: 1 / -1; justify-self: start; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
input[type=month], input[type=date], input[name=name], select { font: inherit; font-size: 16px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); color: var(--ink); }
.themes { display: flex; gap: 6px; }
.themes button { flex: 1; border: 1px solid var(--line); background: var(--raised); border-radius: var(--r-ctl); padding: 10px; font-weight: 600; }
.themes [aria-pressed="true"] { border-color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--ink); }
.tripform { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tripform input[name=name], .tripform .btn { grid-column: 1 / -1; }
.trips { list-style: none; padding: 0; margin: 0 0 10px; }
.trips li { display: flex; gap: 10px; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.trips small, .manage small { display: block; color: var(--muted); font-size: 12px; }
.check.span { grid-column: 1 / -1; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }

.empty { margin: 16vh 24px 0; }
.empty.small { margin-top: 10vh; }
.empty h1 { font-family: var(--num); font-size: 32px; font-weight: 800; margin-bottom: 8px; }
.empty p { color: var(--muted); }

.txs { list-style: none; padding: 0; margin: 0 0 12px; }
.txs li { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.txs li.saved { background: linear-gradient(90deg, transparent, var(--lagoon-soft)); }
.txs div span { display: block; font-size: 12px; color: var(--muted); }
.txs strong { font-family: var(--num); }
.txs strong.pos { color: var(--lagoon); }
.txs label { grid-column: 1 / -1; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.txs label select { flex: 1; min-width: 0; }
.txs details { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.txs details p { margin: 6px 0 0; word-break: break-word; }
.report { padding-left: 18px; font-size: 14px; }
.report .bad, .bad { color: var(--coral); }
.recon-list { list-style: none; margin: 0; padding: 0; }
.recon-list li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.recon-list div { display: flex; justify-content: space-between; font-size: 14px; }
.recon-list div span { font-weight: 650; }
.recon-list li.ok div span { color: var(--lagoon); } .recon-list li.bad div span { color: var(--coral); }
.recon-list p { margin: 4px 0 0; font-size: 12px; color: var(--muted); font-family: var(--num); }
#sheet-body h3, .card h3 { font-size: 14px; margin: 18px 0 6px; color: var(--muted); font-weight: 650; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.stack input, .stack select { font: inherit; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); color: var(--ink); }
.manage { list-style: none; margin: 0; padding: 0; }
.manage li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.card.flag { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; }
.card.flag span { display: block; font-size: 12px; color: var(--muted); }
.card.flag strong { font-family: var(--num); }
.card.flag .row { grid-column: 1 / -1; }
input[type=search] { width: 100%; font: inherit; font-size: 16px; padding: 11px 14px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); color: var(--ink); margin-top: 6px; }
.results { list-style: none; margin: 0 12px; padding: 0; background: var(--surface); border-radius: var(--r-card); border: 1px solid var(--line); overflow: hidden; }
.results button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 0; background: none; padding: 11px 14px; border-bottom: 1px solid var(--line); text-align: left; }
.results small { display: block; font-size: 12px; color: var(--muted); }
.results strong { font-family: var(--num); } .results strong.pos { color: var(--lagoon); }

/* ---------- cloud status ---------- */
.topbar .row { flex-wrap: nowrap; }
.cloud-pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.cloud-pill::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--saffron); margin-right: 7px; vertical-align: 1px; }
.cloud-pill.ok::before { background: var(--lagoon); }
.cloud-pill.bad { color: var(--coral); } .cloud-pill.bad::before { background: var(--coral); }
.stack input[type=password] { letter-spacing: .08em; }
.stack label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); }

/* ---------- insights ---------- */
.card h2 small { font-weight: 500; color: var(--muted); font-size: 13px; margin-left: 6px; }
.pbar { display: block; height: 10px; border-radius: 5px; background: var(--raised); overflow: hidden; margin: 6px 0 4px; }
.pbar i { display: block; height: 100%; border-radius: 5px; background: var(--lagoon); }
.pbar.near i { background: var(--saffron); } .pbar.over i { background: var(--coral); }
.budgets { list-style: none; margin: 0 0 8px; padding: 0; }
.budgets li { padding: 8px 0; }
.budgets li div { display: flex; justify-content: space-between; font-size: 14px; }
.budgets b { font-family: var(--num); } .budgets b small { color: var(--muted); font-weight: 500; }
.budgets small.ok { color: var(--muted); } .budgets small.near { color: var(--saffron); } .budgets small.over { color: var(--coral); font-weight: 650; }
.goal { display: flex; align-items: baseline; gap: 8px; } .goal b { font-size: 28px; font-weight: 800; } .goal span { color: var(--muted); font-size: 14px; }
.rec, .upc, .feelist { list-style: none; margin: 0; padding: 0; }
.rec li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.rec li small { display: block; color: var(--muted); font-size: 12px; }
.rec .num { font-weight: 650; text-align: right; white-space: nowrap; } .rec .num small { display: inline; }
.flag { display: inline-block; font-style: normal; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-top: 4px; margin-right: 4px; }
.flag.up { background: var(--coral-soft); color: var(--coral); } .flag.down, .flag.new { background: var(--lagoon-soft); color: var(--lagoon); }
.upc li { display: grid; grid-template-columns: 36px 1fr auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; align-items: baseline; }
.upc .day { font-weight: 700; color: var(--indigo); } .upc small { color: var(--muted); }
.tip { font-size: 13px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--sky) 14%, var(--surface)); margin: 8px 0; }
.feelist li { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; color: var(--muted); }
details summary { cursor: pointer; font-size: 13px; color: var(--indigo); font-weight: 600; }
.shares { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.shares div { background: var(--raised); border-radius: 14px; padding: 10px; }
.shares b { display: block; font-size: 20px; font-weight: 800; } .shares span { font-size: 11px; color: var(--muted); line-height: 1.3; display: block; }
.card h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 4px 0 8px; }
.wd { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 110px; align-items: end; }
.wd li { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 11px; color: var(--muted); }
.wd i { display: block; width: 70%; min-height: 3px; border-radius: 6px 6px 2px 2px; background: color-mix(in srgb, var(--indigo) 45%, transparent); margin-bottom: 4px; }
.wd li.top i { background: var(--indigo); } .wd li.top { color: var(--ink); font-weight: 700; }
.highlights ul { list-style: none; margin: 0; padding: 0; }
.highlights li { position: relative; padding: 8px 0 8px 22px; font-size: 15px; border-bottom: 1px solid var(--line); }
.highlights li:last-child { border-bottom: 0; }
.highlights li::before { content: ""; position: absolute; left: 2px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--sky); }
.highlights li.good::before { background: var(--lagoon); } .highlights li.warn::before { background: var(--saffron); }
.grid td.hot { background: color-mix(in srgb, var(--coral) var(--heat), transparent); }
.hbars li { padding: 0; } .hbars button { position: relative; display: flex; justify-content: space-between; width: 100%; border: 0; background: none; padding: 9px 12px; font-size: 14px; text-align: left; }
.hbars button i { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--sky) 22%, transparent); border-radius: 10px; z-index: 0; }
rect.drill { cursor: pointer; } rect.drill:hover { opacity: .8; }
