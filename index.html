<title>Finances</title>
<script>
  // Apply the saved theme before first paint (no flash).
  try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  // v19: colour theme (Electric by default)
  try { const p = localStorage.getItem('palette'); document.documentElement.dataset.palette = ['electric', 'lagoon', 'classic'].includes(p) ? p : 'electric'; } catch (e) { document.documentElement.dataset.palette = 'electric'; }
</script>
<style>
/* ---------- tokens ---------- */
:root {
  --paper: #EEF2F8; --surface: #FFFFFF; --raised: #F6F8FC; --ink: #121A2E; --muted: #5B6680; --line: #DDE3EE;
  --lagoon: #0E8C7F; --indigo: #3B5BDB; --sky: #6FA3F7; --rose: #E0577A; --saffron: #E89B2B; --coral: #D6453D; --slate: #9AA5BC;
  --lagoon-soft: #DDF3EF; --coral-soft: #FBE4E2;
  --num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --r-hero: 28px; --r-card: 18px; --r-ctl: 12px;
  /* v19: theme roles (Classic values; Electric and Lagoon override them below) */
  --saved: var(--lagoon); --thumb: var(--surface); --thumb-ink: var(--ink); --chip: var(--ink); --chip-ink: var(--paper); --pill: var(--raised); --tab-on: var(--ink);
  --hero: var(--surface); --hero-ink: var(--ink); --hero-muted: var(--muted); --badge-bg: var(--lagoon-soft); --badge-ink: var(--lagoon); --badge-down-bg: var(--raised); --badge-down-ink: var(--muted);
  --ring: var(--lagoon); --ring-track: var(--raised); --ring-text: var(--lagoon); --hero-neg: var(--coral);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #0B1222; --surface: #141D33; --raised: #1B2641; --ink: #EAF0FF; --muted: #93A0BD; --line: #26334F;
  --lagoon: #3DD6B5; --indigo: #7C93FF; --sky: #8EC1FF; --rose: #FF7FA0; --saffron: #FFC061; --coral: #FF7A70; --slate: #5E6B88;
  --lagoon-soft: #123A37; --coral-soft: #3A1E24;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0B1222; --surface: #141D33; --raised: #1B2641; --ink: #EAF0FF; --muted: #93A0BD; --line: #26334F;
    --lagoon: #3DD6B5; --indigo: #7C93FF; --sky: #8EC1FF; --rose: #FF7FA0; --saffron: #FFC061; --coral: #FF7A70; --slate: #5E6B88;
    --lagoon-soft: #123A37; --coral-soft: #3A1E24;
    color-scheme: dark;
  }
}

@media (prefers-color-scheme: dark) { :root[data-palette="electric"]:not([data-theme="light"]) { --paper: #0A0B16; --surface: #15172B; --raised: #1D1F37; --ink: #F2F3FF; --muted: #A0A4C6; --line: #272A46; --lagoon: #2EE6A8; --indigo: #8B7DFF; --sky: #4CC4FF; --rose: #FF6FA3; --saffron: #FFB347; --coral: #FF6B70; --slate: #5D6185; --lagoon-soft: #12352C; --coral-soft: #3B1A22; --saved: #2EE6A8; --thumb: #7D6FFF; --thumb-ink: #FFFFFF; --chip: #7D6FFF; --chip-ink: #FFFFFF; --pill: #28245A; --tab-on: #B4AAFF; --hero: #4E3EEB; --hero-ink: #FFFFFF; --hero-muted: rgba(255,255,255,.82); --badge-bg: rgba(255,255,255,.18); --badge-ink: #FFFFFF; --badge-down-bg: rgba(255,255,255,.12); --badge-down-ink: #FFFFFF; --ring: #5CF2C2; --ring-track: rgba(255,255,255,.2); --ring-text: #FFFFFF; --hero-neg: #FFC9D2; color-scheme: dark; } }
:root[data-palette="lagoon"] { --paper: #F1F7F6; --surface: #FFFFFF; --raised: #E8F2F1; --ink: #0B1F24; --muted: #4F6A70; --line: #D8E7E5; --lagoon: #00806E; --indigo: #3D5AFE; --sky: #18B4F0; --rose: #FF5C7A; --saffron: #FFA41B; --coral: #E5303A; --slate: #93AEAB; --lagoon-soft: #D6F2EC; --coral-soft: #FFE3E6; --saved: #00B894; --thumb: #FFFFFF; --thumb-ink: #00806E; --chip: #00806E; --chip-ink: #FFFFFF; --pill: #D6F2EC; --tab-on: #00806E; --hero: #00806E; --hero-ink: #FFFFFF; --hero-muted: rgba(255,255,255,.86); --badge-bg: rgba(255,255,255,.2); --badge-ink: #FFFFFF; --badge-down-bg: rgba(255,255,255,.14); --badge-down-ink: #FFFFFF; --ring: #FFD15C; --ring-track: rgba(255,255,255,.22); --ring-text: #FFFFFF; --hero-neg: #FFD0D6; color-scheme: light; }
:root[data-palette="lagoon"][data-theme="dark"] { --paper: #06171A; --surface: #0E2428; --raised: #153034; --ink: #E9FBF7; --muted: #8FB3B0; --line: #1E3A3E; --lagoon: #3FF0C8; --indigo: #7B8CFF; --sky: #5CCBFF; --rose: #FF7F98; --saffron: #FFC15C; --coral: #FF7F80; --slate: #4F6E6C; --lagoon-soft: #123A36; --coral-soft: #3A1E22; --saved: #3FF0C8; --thumb: #22C9AE; --thumb-ink: #04211D; --chip: #22C9AE; --chip-ink: #04211D; --pill: #163F3A; --tab-on: #3FF0C8; --hero: #0B6E61; --hero-ink: #FFFFFF; --hero-muted: rgba(255,255,255,.82); --badge-bg: rgba(255,255,255,.18); --badge-ink: #FFFFFF; --badge-down-bg: rgba(255,255,255,.12); --badge-down-ink: #FFFFFF; --ring: #FFD15C; --ring-track: rgba(255,255,255,.2); --ring-text: #FFFFFF; --hero-neg: #FFD0D6; color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root[data-palette="lagoon"]:not([data-theme="light"]) { --paper: #06171A; --surface: #0E2428; --raised: #153034; --ink: #E9FBF7; --muted: #8FB3B0; --line: #1E3A3E; --lagoon: #3FF0C8; --indigo: #7B8CFF; --sky: #5CCBFF; --rose: #FF7F98; --saffron: #FFC15C; --coral: #FF7F80; --slate: #4F6E6C; --lagoon-soft: #123A36; --coral-soft: #3A1E22; --saved: #3FF0C8; --thumb: #22C9AE; --thumb-ink: #04211D; --chip: #22C9AE; --chip-ink: #04211D; --pill: #163F3A; --tab-on: #3FF0C8; --hero: #0B6E61; --hero-ink: #FFFFFF; --hero-muted: rgba(255,255,255,.82); --badge-bg: rgba(255,255,255,.18); --badge-ink: #FFFFFF; --badge-down-bg: rgba(255,255,255,.12); --badge-down-ink: #FFFFFF; --ring: #FFD15C; --ring-track: rgba(255,255,255,.2); --ring-text: #FFFFFF; --hero-neg: #FFD0D6; color-scheme: dark; } }

/* ---------- base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--paper); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.45 var(--text); font-variant-numeric: tabular-nums;
  padding: env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom)); }
h1, h2, h3 { margin: 0; letter-spacing: -0.015em; }
h2 { font-size: 16px; font-weight: 650; margin-bottom: 12px; }
.h1 { font-size: 26px; font-weight: 750; font-family: var(--num); }
.fine { color: var(--muted); font-size: 13px; margin: 6px 0 12px; }
.pad { padding: 4px 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--num); }

.app { max-width: 680px; margin: 0 auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 4px; }
.topbar h1 { font-family: var(--num); font-size: 30px; font-weight: 800; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.banner { display: block; width: calc(100% - 24px); margin: 8px 12px 0; padding: 11px 14px; border: 1px solid color-mix(in srgb, var(--saffron) 55%, transparent); background: color-mix(in srgb, var(--saffron) 14%, var(--surface)); border-radius: var(--r-ctl); text-align: left; font-size: 14px; }

/* ---------- period picker ---------- */
.modes { position: relative; display: flex; gap: 2px; margin: 12px 12px 0; padding: 3px; background: var(--raised); border: 1px solid var(--line); border-radius: 14px; }
.modes button { position: relative; z-index: 1; flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 11px; font-size: 14px; font-weight: 550; color: var(--muted); transition: color .2s; }
.modes [aria-selected="true"], .modes [aria-pressed="true"] { color: var(--thumb-ink); font-weight: 650; }
/* v18: one sliding thumb per segmented control (moved with transform only) */
.thumb { position: absolute; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 11px; background: var(--thumb); box-shadow: 0 1px 3px color-mix(in srgb, var(--ink) 18%, transparent); pointer-events: none; will-change: transform; transform-origin: 50% 50%; }
.periods { display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px 2px; scrollbar-width: none; }
.periods::-webkit-scrollbar { display: none; }
.periods button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-family: var(--num); font-weight: 600; }
.periods [aria-selected="true"] { background: var(--chip); border-color: var(--chip); color: var(--chip-ink); }

/* ---------- hero: the month as a flow of money ---------- */
.hero { margin: 12px 12px 14px; padding: 0 20px 18px; background: var(--surface); border-radius: var(--r-hero); border: 1px solid var(--line); overflow: hidden; }
/* v19: the top of the hero is a coloured band in Electric and Lagoon (surface colour in Classic) */
.hero-top { margin: 0 -20px 16px; padding: 20px 20px 16px; background: var(--hero); color: var(--hero-ink); }
.hero-top .saved-fig { color: var(--hero-ink); } .hero-top .saved-fig.neg { color: var(--hero-neg); } .hero-top .saved-cap { color: var(--hero-muted); margin-bottom: 0; }
.hero-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.hero-head p { margin: 0; color: var(--hero-muted); font-size: 14px; }
.badge { font-size: 12px; font-weight: 650; padding: 4px 10px; border-radius: 999px; background: var(--badge-bg); color: var(--badge-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.badge.down { background: var(--badge-down-bg); color: var(--badge-down-ink); }
.badge.neg { background: var(--coral-soft); color: var(--coral); }
.saved-fig { font-family: var(--num); font-weight: 800; font-size: clamp(44px, 12vw, 64px); letter-spacing: -0.035em; line-height: 1; margin: 10px 0 4px; }
.saved-fig.neg { color: var(--coral); }
.saved-cap { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.river { display: flex; height: 22px; border-radius: 11px; overflow: hidden; background: var(--raised); gap: 2px; }
.river i { display: block; height: 100%; transform-origin: left; animation: grow .7s cubic-bezier(.2,.8,.2,1) both; }
.river i:nth-child(2) { animation-delay: .06s; } .river i:nth-child(3) { animation-delay: .12s; } .river i:nth-child(4) { animation-delay: .18s; } .river i:nth-child(5) { animation-delay: .24s; }
.river .over { background: repeating-linear-gradient(135deg, var(--coral) 0 5px, transparent 5px 9px); }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.c-fixed { background: var(--indigo); } .c-variable { background: var(--sky); } .c-onetime { background: var(--rose); } .c-india { background: var(--saffron); } .c-saved { background: var(--saved); } .c-earned { background: var(--ink); }
.flow { list-style: none; margin: 16px 0 0; padding: 0; }
.flow li { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; font-size: 15px; }
.flow li .dot { width: 10px; height: 10px; border-radius: 3px; }
.flow li span { color: var(--muted); }
.flow li b { font-family: var(--num); font-weight: 650; }
.flow li.lead span, .flow li.total span { color: var(--ink); font-weight: 600; }
.flow li.total { border-top: 2px solid var(--ink); margin-top: 4px; padding-top: 10px; }
.flow li.total b { font-size: 18px; }
.flow li.sub span { font-size: 13px; }
.went { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--raised); }
.went h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.went div { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
.went b { font-family: var(--num); }
.seal { margin: 14px 0 0; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.seal::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--slate); flex: none; }
.seal.ok::before { background: var(--lagoon); }
.seal.bad { color: var(--coral); } .seal.bad::before { background: var(--coral); }
button.seal { border: 0; background: none; padding: 0; text-align: left; }

/* ---------- cards & charts ---------- */
.card { margin: 0 12px 12px; padding: 18px; background: var(--surface); border-radius: var(--r-card); border: 1px solid var(--line); }
.card.danger h2 { color: var(--coral); }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--slate); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 10px; font-family: var(--text); }
.chart .val { fill: var(--ink); font-size: 10px; font-weight: 700; font-family: var(--num); }
.b-in { fill: var(--lagoon); opacity: .45; } .b-out { fill: var(--indigo); opacity: .4; }
.b-in.sel, .b-out.sel { opacity: 1; }
.l-sav { fill: none; stroke: var(--ink); stroke-width: 1.8; } .d-sav { fill: var(--surface); stroke: var(--ink); stroke-width: 1.8; }
.a-rate { fill: color-mix(in srgb, var(--lagoon) 18%, transparent); } .l-rate { fill: none; stroke: var(--lagoon); stroke-width: 2.4; } .d-rate { fill: var(--lagoon); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 10px 0 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.k-in { background: var(--lagoon); } .k-out { background: var(--indigo); } .k-sav { background: var(--ink); height: 3px !important; vertical-align: 3px !important; }
.hbars { list-style: none; margin: 0; padding: 0; }
.hbars li { position: relative; display: flex; justify-content: space-between; padding: 9px 12px; margin-bottom: 5px; font-size: 14px; }
.hbars li i { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--sky) 22%, transparent); border-radius: 10px; z-index: 0; }
.hbars span, .hbars b { position: relative; z-index: 1; }
.hbars b { font-family: var(--num); }

/* ---------- tables ---------- */
.seg { position: relative; display: flex; gap: 2px; margin: 12px 12px 10px; padding: 3px; background: var(--raised); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; }
.seg button { position: relative; z-index: 1; flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 11px; font-size: 13px; font-weight: 550; color: var(--muted); white-space: nowrap; }
.seg [aria-selected="true"] { color: var(--thumb-ink); font-weight: 650; }
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 12px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); }
table.grid { border-collapse: collapse; font-size: 13px; min-width: 100%; }
.grid th, .grid td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.grid td, .grid tfoot th { font-family: var(--num); }
.grid thead th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--surface); }
.grid th:first-child { position: sticky; left: 0; background: var(--surface); text-align: left; white-space: normal; min-width: 140px; max-width: 170px; font-weight: 500; z-index: 1; box-shadow: 1px 0 0 var(--line); font-family: var(--text); }
.grid td button { border: 0; background: none; padding: 0; text-align: right; display: block; width: 100%; font-family: var(--num); }
.grid td small { display: block; color: var(--muted); font-size: 10px; white-space: nowrap; font-family: var(--text); }
.grid td.nil { color: var(--slate); }
.grid .tot { font-weight: 700; }
.grid tr.bar th span { position: sticky; left: 10px; display: inline-block; }
.grid tr.bar th { background: var(--raised); color: var(--indigo); font-size: 12px; font-weight: 650; text-align: left; position: static; box-shadow: none; }
.grid tfoot th, .grid tfoot td { font-weight: 700; border-bottom: 0; background: var(--raised); }
.grid tfoot tr:first-child th, .grid tfoot tr:first-child td { border-top: 2px solid var(--ink); }

/* ---------- controls ---------- */
.btn { display: inline-block; border: 1px solid var(--line); background: var(--surface); padding: 11px 16px; border-radius: var(--r-ctl); font-size: 15px; font-weight: 600; margin: 4px 6px 4px 0; text-align: center; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.warn { color: var(--coral); border-color: var(--coral); background: transparent; }
.link { border: 0; background: none; color: var(--indigo); padding: 0; font-weight: 550; }
.link.danger { color: var(--coral); }
.link.small { font-size: 13px; grid-column: 1 / -1; justify-self: start; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
input[type=month], input[type=date], input[name=name], select { font: inherit; font-size: 16px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); color: var(--ink); }
.modes.opts { margin: 10px 0 8px; }
.tripform { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tripform input[name=name], .tripform .btn { grid-column: 1 / -1; }
.trips { list-style: none; padding: 0; margin: 0 0 10px; }
.trips li { display: flex; gap: 10px; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.trips small, .manage small { display: block; color: var(--muted); font-size: 12px; }
.check.span { grid-column: 1 / -1; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }

.empty { margin: 16vh 24px 0; }
.empty.small { margin-top: 10vh; }
.empty h1 { font-family: var(--num); font-size: 32px; font-weight: 800; margin-bottom: 8px; }
.empty p { color: var(--muted); }

.txs { list-style: none; padding: 0; margin: 0 0 12px; }
.txs li { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.txs li.saved { background: linear-gradient(90deg, transparent, var(--lagoon-soft)); }

html[data-motion="reduced"] .tabbar button:active svg, html[data-motion="reduced"] .icon-btn:active, html[data-motion="reduced"] .btn:active, html[data-motion="reduced"] .periods button:active { transform: none; }
#review-badge { position: absolute; top: 0; left: calc(50% + 6px); background: var(--coral); color: #fff; font-size: 10px; border-radius: 999px; padding: 1px 6px; font-weight: 700; }

#sheet { position: fixed; inset: 0; background: color-mix(in srgb, #050A16 45%, transparent); z-index: 10; display: flex; align-items: flex-end; }
#sheet-body { width: 100%; max-width: 680px; margin: 0 auto; max-height: 86vh; overflow-y: auto; background: var(--surface); border-radius: 24px 24px 0 0; padding: 22px 20px calc(20px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .24s ease-out; }
#sheet.open #sheet-body { transform: none; }
#sheet-body h2 { font-family: var(--num); font-size: 20px; font-weight: 750; }
#busy { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 999px; font-size: 14px; z-index: 20; }
#toast { position: fixed; left: 12px; right: 12px; bottom: calc(84px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; background: var(--ink); color: var(--paper); border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; z-index: 30; }
#toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }

/* ---------- laptop / wide screens ---------- */
@media (min-width: 960px) {
  body { padding: 0 0 0 232px; }
  .app { max-width: 1240px; padding: 18px 28px 40px; }
  .tabbar { top: 0; right: auto; width: 232px; flex-direction: column; justify-content: flex-start; gap: 4px; padding: 26px 14px; border-top: 0; border-right: 1px solid var(--line); }
  .tabbar .brand { display: block; padding: 0 10px 22px; }
  .tabbar .brand img { width: 56px; height: 56px; border-radius: 14px; border: 1px solid var(--line); display: block; }
  .tabbar button { flex: 0 0 auto; flex-direction: row; gap: 12px; padding: 11px 12px; font-size: 15px; border-radius: 12px; justify-content: flex-start; }
  #review-badge { position: static; margin-left: auto; }
  .topbar { padding: 6px 12px 4px; }
  .overview { display: grid; grid-template-columns: minmax(360px, 5fr) 7fr; gap: 0 4px; align-items: start; }
  .overview .hero { position: sticky; top: 18px; grid-row: span 6; }
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; }
  .chart-grid .wide { grid-column: 1 / -1; }
  .data-grid { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
  .data-grid .wide { grid-column: 1 / -1; }
  .grid th:first-child { min-width: 220px; max-width: 280px; }
  .grid { font-size: 14px; }
  #sheet { align-items: center; }
  #sheet-body { max-width: 560px; border-radius: 24px; max-height: 80vh; transform: translateY(16px); opacity: 0; transition: transform .2s ease-out, opacity .2s; }
  #sheet.open #sheet-body { opacity: 1; }
  #toast { left: 260px; bottom: 24px; }
}
.river i { animation-duration: calc(.7s * var(--spd, 1)); }
html[data-motion="reduced"] .river i { animation: none; }
html[data-motion="reduced"] #sheet-body { transform: none; transition: opacity .2s; opacity: 0; }
html[data-motion="reduced"] #sheet.open #sheet-body { opacity: 1; }
</style>
